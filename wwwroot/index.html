<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElevenLabs — озвучивание текста</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 760px">
    <h1 class="h2 mb-4">Озвучивание текста</h1>
    <form id="speech-form" class="bg-body border rounded-4 p-4">
      <label for="text" class="form-label fw-semibold">Текст</label>
      <textarea id="text" class="form-control mb-3" rows="8" maxlength="5000" required
        placeholder="Введите текст для озвучивания"></textarea>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="voice" class="form-label">Голос</label>
          <select id="voice" class="form-select" required><option value="">Загрузка…</option></select>
        </div>
        <div class="col-md-4">
          <label for="language" class="form-label">Язык</label>
          <select id="language" class="form-select" required></select>
        </div>
        <div class="col-md-4">
          <label for="quality" class="form-label">Качество MP3</label>
          <select id="quality" class="form-select" required></select>
        </div>
      </div>
      <button id="generate" type="submit" class="btn btn-primary" disabled>Озвучить</button>
      <button id="stop" type="button" class="btn btn-outline-secondary" hidden>Остановить</button>
      <p id="status" class="small mt-3 mb-0" role="status"></p>
      <audio id="audio" class="w-100 mt-3" controls hidden></audio>
    </form>
  </main>
</body>
</html>
